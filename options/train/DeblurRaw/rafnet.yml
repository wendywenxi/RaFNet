name: RaFNet-deblur
model_type: ImageRestorationModel
scale: 1
num_gpu: 4 
manual_seed: 42

# dataset and data loader settings
datasets:
  train:
    name: Deblur_RAW
    type: PairedRawImageDataset
    root_dir: /datasets/DEBLUR_RAW/train/
    geometric_augs: false
    filename_tmpl: '{}'
    io_backend:
      type: disk

    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 32
    gt_size: 128 

    dataset_enlarge_ratio: 1
    prefetch_mode: ~
    max_pixel_value: 16383

  val:
    name: Deblur_RAW_val
    type: PairedRawImageDataset
    root_dir: /datasets/DEBLUR_RAW/test/
    gt_size: 128 
    io_backend:
      type: disk
    max_pixel_value: 16383

# network structures
network_g:
  type: RaFNet
  in_channel: 4
  out_channel: 4
  img_size: 128 
  width: 32
  middle_blk_num: 8
  enc_blk_nums: [ 2, 2, 4 ]
  dec_blk_nums: [ 4, 2, 2 ]
  train_size: 128
  grid_overlap_size: 64 
  fft_kernel_mode: fixed
  fixed_fft_kernel: 4
  dynamic_fft_kernel_divisor: 8

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  total_iter: 300000 
  warmup_iter: -1 # no warm up
  color_augs: false

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 300000
    eta_min: !!float 1e-7

  optim_g:
    type: AdamW
    lr: !!float 1e-3 # !!float 1e-3 # 3e-4
    weight_decay: !!float 1e-4
    betas: [0.9, 0.999]

  # losses
  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: 'mean'

# validation settings
val:
  val_freq: !!float 2e4 
  save_img: false
  rgb2bgr: false
  use_image: false

  metrics:
    psnr: 
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: false
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29500
