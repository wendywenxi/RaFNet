# general settings
name: RaFNet-denoise-sidd
model_type: ImageRestorationModel
scale: 1
num_gpu: 4
manual_seed: 42

datasets:
  train:
    name: sidd-train
    type: PairedSIDDRawDataset
    dataroot_gt: /datasets/SIDD_Medium_Raw/train/gt_crops
    dataroot_lq: /datasets/SIDD_Medium_Raw/train/input_crops
    geometric_augs: true

    filename_tmpl: '{}'
    io_backend:
      type: disk

    gt_size: 256
    use_flip: true
    use_rot: true

    # data loader
    use_shuffle: true
    num_worker_per_gpu: 8
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    name: sidd-test
    type: PairedSIDDRawDataset
    dataroot_gt: /datasets/SIDD_Medium_Raw/val/gt
    dataroot_lq: /datasets/SIDD_Medium_Raw/val/noisy
    io_backend:
      type: disk

    gt_size: 256


network_g:
  type: RaFNet
  in_channel: 1
  out_channel: 1
  width: 32
  middle_blk_num: 8
  enc_blk_nums: [2, 2, 4]
  dec_blk_nums: [4, 2, 2]
  img_size: 256
  fft_kernel_mode: fixed
  fixed_fft_kernel: 4


# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# training settings
train:
  optim_g:
    type: AdamW
    lr: !!float 1e-3
    weight_decay: !!float 1e-3
    betas: [0.9, 0.999]

  scheduler:
    type: TrueCosineAnnealingLR
    T_max: 400000
    eta_min: !!float 1e-7

  total_iter: 400000
  warmup_iter: -1 # no warm up

  grad_clip:
    max_norm: 0.01
    norm_type: 2

  pixel_opt:
    type: L1Loss
    loss_weight: 1
    reduction: mean

  fft_loss_opt:
    type: FFTLoss
    loss_weight: 0.1
    reduction: 'mean'

  # pixel_opt:
  #   type: PSNRLoss
  #   loss_weight: 1
  #   reduction: mean

# validation settings
val:
  val_freq: !!float 2e4
  save_img: false
  grids: true
  crop_size_h: 128
  crop_size_w: 128
  overlap_h: 16
  overlap_w: 16
  max_minibatch: 16

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: false

# logging settings
logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: true
  wandb:
    project: ~
    resume_id: ~

# dist training settings
dist_params:
  backend: nccl
  port: 29555
