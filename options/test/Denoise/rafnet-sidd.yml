# general settings
name: rafnet-denoise-test
model_type: ImageRestorationModelsiddraw
scale: 1
num_gpu: 4 # set num_gpu: 0 for cpu mode
manual_seed: 42

# dataset and data loader settings
datasets:

  test:
    name: sidd-test
    type: PairedSIDDRawDataset
    dataroot_gt: /datasets/SIDD_Medium_Raw/val/gt
    dataroot_lq: /datasets/SIDD_Medium_Raw/val/noisy

    io_backend:
      type: disk

# network structures
network_g:
  type: RaFNet
  in_channel: 1
  out_channel: 1
  width: 32
  img_size: 256
  middle_blk_num: 8
  enc_blk_nums: [ 2, 2, 4 ]
  dec_blk_nums: [ 4, 2, 2 ]
  # grid_overlap_size: 128
  fft_kernel_mode: fixed
  fixed_fft_kernel: 4
  # dynamic_fft_kernel_divisor: 8
  # afpm_overlap_ratio: 0

# path
path:
  pretrain_network_g: ~
  strict_load_g: true
  resume_state: ~

# validation settings
val:
  save_img: true
  grids: false


  # metrics:
  #   psnr: # metric name, can be arbitrary
  #     type: calculate_psnr
  #     crop_border: 0
  #     test_y_channel: false
  #   ssim:
  #     type: calculate_ssim
  #     crop_border: 0
  #     test_y_channel: false

# dist training settings
dist_params:
  backend: nccl
  port: 29500
